# `brew install mlevin2/waitfor/waitfor` in the official Homebrew Linux image.
# On push/PR, weekly cron, and workflow_dispatch (same as local `make brew-smoke`).
name: Brew smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"

concurrency:
  group: brew-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Checkout on the host (avoids actions/checkout in a service-style container, which
# can hit EACCES on GHA), then `docker run` the official brew image like `make brew-smoke`.
jobs:
  homebrew-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tap, install, test (Docker)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            -e HOMEBREW_NO_AUTO_UPDATE=1 \
            -e HOMEBREW_NO_ANALYTICS=1 \
            -e HOMEBREW_NO_ENV_HINTS=1 \
            -e WAITFOR_TAP_DIR=/src \
            ghcr.io/homebrew/brew:latest \
            /bin/bash scripts/homebrew-smoke-inner.sh
