# Matrix: headless `tests/run.sh` (no GUI, no manual-*.sh). Homebrew: see brew-smoke.yml.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-14
          - macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep and shellcheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck

      - name: Install ripgrep and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep shellcheck

      - name: Lint (ShellCheck)
        run: bash scripts/lint.sh

      - name: Run test suite
        run: bash tests/run.sh
