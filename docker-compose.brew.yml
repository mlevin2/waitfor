# Homebrew install smoke; isolates from host PATH.
# Reuses scripts/homebrew-smoke-inner.sh (same as .github/workflows/brew-smoke.yml).
#
#   bash scripts/test-homebrew-docker.sh
#   make brew-smoke
#   docker compose -f docker-compose.brew.yml run --rm homebrew-smoke
#
# Optional image without bind mount: docker/Dockerfile.homebrew-smoke
services:
  homebrew-smoke:
    image: ghcr.io/homebrew/brew:latest
    pull_policy: missing
    init: true
    working_dir: /src
    volumes:
      - .:/src:ro
    environment:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      # Use the bind-mounted tree so the Formula/ at the working copy is what brew loads.
      WAITFOR_TAP_DIR: /src
    command: ["/bin/bash", "scripts/homebrew-smoke-inner.sh"]
